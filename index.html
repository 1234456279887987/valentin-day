<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quieres ser mi Valentín? 💖</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffe6e6, #ffb3b3);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }
    h1 {
      color: #cc0000;
      font-size: 50px;
      margin-top: 50px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    button {
      padding: 10px 20px;
      font-size: 20px;
      margin: 20px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: background-color 0.3s;
    }
    #yesButton {
      background-color: #a3d2ca;
      color: #034f84;
    }
    #yesButton:hover {
      background-color: #79b4a6;
    }
    #noButton {
      background-color: #f7cac9;
      color: #c94c4c;
      position: relative;
    }
    /* Estilos para los corazones decorativos */
    .heart {
      position: absolute;
      font-size: 24px;
      animation: float 4s infinite;
      user-select: none;
    }
    @keyframes float {
      0%   { transform: translateY(0) scale(0.8); opacity: 0.8; }
      50%  { transform: translateY(-20px) scale(1.2); opacity: 1; }
      100% { transform: translateY(0) scale(0.8); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <h1>¿Quieres ser mi Valentín? ❤️</h1>
  <button id="yesButton" onclick="alert('¡Sabía que dirías que sí! 💕')">Sí 💖</button>
  <button id="noButton">No</button>

  <!-- Corazones decorativos en distintas posiciones -->
  <span class="heart" style="top: 10%; left: 20%;">❤️</span>
  <span class="heart" style="top: 30%; left: 80%;">💖</span>
  <span class="heart" style="top: 50%; left: 50%;">💕</span>
  <span class="heart" style="top: 70%; left: 15%;">💓</span>
  <span class="heart" style="top: 80%; left: 70%;">💘</span>

  <script>
    const noButton = document.getElementById('noButton');

    // Cuando el mouse se acerca al botón de "No", este se mueve a una posición aleatoria
    noButton.addEventListener('mouseover', function() {
      const maxWidth = window.innerWidth - noButton.offsetWidth;
      const maxHeight = window.innerHeight - noButton.offsetHeight;
      const randomX = Math.floor(Math.random() * maxWidth);
      const randomY = Math.floor(Math.random() * maxHeight);
      noButton.style.position = 'absolute';
      noButton.style.left = randomX + 'px';
      noButton.style.top = randomY + 'px';
    });
  </script>
</body>
</html>
